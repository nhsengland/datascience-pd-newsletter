name: Notify integration test

# Sends to 600 example.com addresses with the Notify test key. Nothing is delivered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: notify-test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked

      - name: Bulk send with the test key
        working-directory: notify-mailer
        env:
          NOTIFY_API_KEY_TEST: ${{ secrets.NOTIFY_API_KEY_TEST }}
          NOTIFY_TEMPLATE_ID: ${{ vars.NOTIFY_TEMPLATE_ID }}
        run: uv run pytest -m integration -v
